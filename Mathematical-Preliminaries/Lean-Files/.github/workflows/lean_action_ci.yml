name: Lean Action CI

on:
  push:
    paths:
      - 'Mathematical-Preliminaries/Lean-Files/**'
  pull_request:
    paths:
      - 'Mathematical-Preliminaries/Lean-Files/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
